name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gate:
    name: Build, Test & Size Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dataframe-dev image
        run: docker build -t dataframe-dev .

      - name: Run gate inside dataframe-dev container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            dataframe-dev \
            bash -lc "npm install && npm run gate"

  bench:
    name: Benchmark Regression Gate
    runs-on: ubuntu-latest
    # Non-blocking: machine variance may cause flaky failures on shared runners.
    # The script itself is strict (exits 1 on >10% regression); annotate as
    # continue-on-error so CI stays green on transient slowdowns.
    continue-on-error: true
    needs: gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dataframe-dev image
        run: docker build -t dataframe-dev .

      - name: Run benchmark regression check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            dataframe-dev \
            bash -lc "npm install && npm run build && node scripts/check-regression.mjs"
