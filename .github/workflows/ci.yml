name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gate:
    name: Build, Test & Size Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dataframe-dev image
        run: docker build -t dataframe-dev .

      - name: Run gate inside dataframe-dev container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            dataframe-dev \
            bash -lc "npm install && npm run gate"
